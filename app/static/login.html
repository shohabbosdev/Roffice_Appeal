<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tizimga kirish — Registrator ofisi axborot tizimi</title>
  
  <script>
    (function() {
      const isSub = window.location.pathname.startsWith('/roffice-appeal');
      window.APP_BASE = isSub ? '/roffice-appeal' : '';
      let b = document.querySelector('base');
      if (!b) {
        b = document.createElement('base');
        document.head.prepend(b);
      }
      b.href = isSub ? '/roffice-appeal/' : '/';

      if (window.APP_BASE) {
        const origFetch = window.fetch;
        window.fetch = function(inp, init) {
          if (typeof inp === 'string' && (inp.startsWith('/api/') || inp.startsWith('/static/'))) {
            inp = window.APP_BASE + inp;
          }
          return origFetch(inp, init);
        };
      }
    })();
    function apiUrl(p) {
      if (!p || p.startsWith('http')) return p || '';
      return (window.APP_BASE || '') + (p.startsWith('/') ? p : '/' + p);
    }
    function pageUrl(p) {
      if (!p || p.startsWith('http')) return p || '';
      return (window.APP_BASE || '') + (p.startsWith('/') ? p : '/' + p);
    }
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="static/img/logo.png">

  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow-effect {
      box-shadow: 0 0 60px -10px rgba(37, 99, 235, 0.28);
    }
    .ambient-mesh {
      background-image: 
        radial-gradient(at 10% 10%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.09) 0px, transparent 50%);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased ambient-mesh selection:bg-blue-600 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-md px-4 sm:px-6 py-3.5 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="static/img/logo.png" alt="O'zMU JF Logotipi" class="w-10 h-10 object-contain drop-shadow-md">
        <div>
          <h1 class="text-sm sm:text-base font-bold text-white tracking-tight leading-tight">Registrator ofisi</h1>
          <p class="text-[11px] sm:text-xs text-slate-400">O'zMU Jizzax filiali axborot tizimi</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Ish vaqti: 09:00 — 17:00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Login Section -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-md">
      
      <!-- Login Card -->
      <div class="glass-card rounded-2xl sm:rounded-3xl p-6 sm:p-8 glow-effect shadow-2xl">
        
        <!-- Logo and Header -->
        <div class="text-center mb-6 sm:mb-8">
          <div class="inline-flex items-center justify-center p-2.5 rounded-3xl bg-white/5 border border-white/10 mb-4 shadow-xl ring-1 ring-white/10">
            <img src="static/img/logo.png" alt="O'zMU Jizzax Filiali Rasmiy Logotipi" class="w-20 h-20 sm:w-24 sm:h-24 object-contain">
          </div>
          <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Tizimga kirish</h2>
          <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">Mirzo Ulug'bek nomidagi O'zbekiston Milliy universiteti Jizzax filiali</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border transition-all duration-200"></div>

        <!-- Login Form -->
        <form id="unified-login-form" onsubmit="handleUnifiedLogin(event)" class="space-y-4">
          <div>
            <label for="login-username" class="block text-xs font-semibold text-slate-300 mb-1.5">
              Login, Email yoki HEMIS talaba ID
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <input
                type="text"
                id="login-username"
                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                placeholder="Login, elektron pochta yoki talaba ID"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="login-password" class="block text-xs font-semibold text-slate-300">
                Maxfiy parol
              </label>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <input
                type="password"
                id="login-password"
                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-11 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                placeholder="Parolingizni kiriting"
                autocomplete="current-password"
                required
              >
              <!-- Eye Toggle Button (Ko'zcha) -->
              <button
                type="button"
                id="toggle-password-btn"
                onclick="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition cursor-pointer"
                title="Parolni ko'rsatish yoki yashirish"
              >
                <!-- Open Eye Icon -->
                <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <!-- Closed Eye / Eye-slash Icon -->
                <svg id="eye-slash-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full mt-3 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg shadow-blue-600/25 hover:shadow-blue-600/40 active:scale-[0.99] transition duration-150 cursor-pointer disabled:opacity-50"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            <span>Tizimga kirish</span>
          </button>
        </form>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-900/40 py-3.5 px-4 text-center text-xs text-slate-400">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>Registrator ofisi axborot tizimi &copy; 2026</span>
      <span>O'zMU Jizzax filiali • Nizom 73-sonli buyrug'i asosida</span>
    </div>
  </footer>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      const eyeSlashIcon = document.getElementById('eye-slash-icon');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeSlashIcon.classList.remove('hidden');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeSlashIcon.classList.add('hidden');
      }
    }

    async function handleUnifiedLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('login-alert');
      const btn = document.getElementById('submit-btn');

      alertBox.className = 'hidden mb-5 p-3.5 rounded-xl text-xs font-medium border';
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Tekshirilmoqda...</span>
      `;

      try {
        const resp = await fetch(apiUrl('/api/v1/auth/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();

        if (resp.ok) {
          localStorage.setItem('roffice_token', data.access_token);
          localStorage.setItem('roffice_role', data.role);
          localStorage.setItem('roffice_fullname', data.full_name);
          localStorage.setItem('roffice_user_id', data.user_id);
          localStorage.setItem('roffice_must_change_password', data.must_change_password ? 'true' : 'false');

          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-medium border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 block';
          alertBox.innerText = "Muvaffaqiyatli kirildi! Shaxsiy kabinetga yo'naltirilmoqda...";

          setTimeout(() => {
            if (data.role === 'student') {
              window.location.href = pageUrl('/student');
            } else {
              window.location.href = pageUrl('/portal');
            }
          }, 350);
        } else {
          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
          alertBox.innerText = data.detail || "Foydalanuvchi nomi yoki parol noto'g'ri.";
        }
      } catch (err) {
        alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
        alertBox.innerText = "Server bilan aloqa o'rnatib bo'lmadi. Tarmoqni tekshiring.";
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          <span>Tizimga kirish</span>
        `;
      }
    }
  </script>
</body>
</html>
