<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tizimga kirish — Registrator ofisi axborot tizimi</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Robust Tailwind CSS with Dynamic DOM Support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-effect {
      box-shadow: 0 0 50px -10px rgba(37, 99, 235, 0.25);
    }
    .ambient-mesh {
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased ambient-mesh selection:bg-blue-600 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md px-4 sm:px-6 py-3.5 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-blue-500/25 ring-1 ring-white/20">
          R
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-bold text-white tracking-tight leading-tight">Registrator ofisi</h1>
          <p class="text-[11px] sm:text-xs text-slate-400">O'zMU Jizzax filiali axborot tizimi</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Ish vaqti: 09:00 — 17:00</span>
        </div>
        <a href="/portal" class="text-xs font-medium text-slate-400 hover:text-white px-3 py-1.5 rounded-lg hover:bg-slate-800/60 transition">
          Portal &rarr;
        </a>
      </div>
    </div>
  </header>

  <!-- Main Login Section -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-md">
      
      <!-- Login Card -->
      <div class="glass-card rounded-2xl sm:rounded-3xl p-6 sm:p-8 glow-effect shadow-2xl">
        
        <div class="text-center mb-6 sm:mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 mb-3 shadow-inner">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Tizimga kirish</h2>
          <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">Talabalar va xodimlar uchun yagona avtorizatsiya darchasi</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border transition-all duration-200"></div>

        <!-- Login Form -->
        <form id="unified-login-form" onsubmit="handleUnifiedLogin(event)" class="space-y-4">
          <div>
            <label for="login-username" class="block text-xs font-semibold text-slate-300 mb-1.5">
              Login yoki HEMIS talaba ID
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <input
                type="text"
                id="login-username"
                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                placeholder="Talaba ID yoki login"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="login-password" class="block text-xs font-semibold text-slate-300">
                Maxfiy parol
              </label>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <input
                type="password"
                id="login-password"
                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
                placeholder="Parolingizni kiriting"
                autocomplete="current-password"
                required
              >
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full mt-2 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg shadow-blue-600/25 hover:shadow-blue-600/40 active:scale-[0.99] transition duration-150 cursor-pointer disabled:opacity-50"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            <span>Tizimga kirish</span>
          </button>
        </form>

        <!-- Fast Demo Credentials Switcher -->
        <div class="mt-6 pt-5 border-t border-slate-800/80">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2.5 text-center">
            Tezkor sinov hisoblari
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              onclick="fillCredentials('401251200032', '(Zetmax0011)')"
              class="text-left p-2 rounded-xl border border-slate-800/80 hover:border-blue-500/40 bg-slate-950/60 hover:bg-slate-900 text-slate-300 text-xs transition cursor-pointer"
            >
              <div class="font-medium text-white text-xs truncate">Zoxidjon</div>
              <div class="text-[10px] text-blue-400 truncate">Talaba (HEMIS)</div>
            </button>
            <button
              type="button"
              onclick="fillCredentials('front_staff1', 'front123')"
              class="text-left p-2 rounded-xl border border-slate-800/80 hover:border-emerald-500/40 bg-slate-950/60 hover:bg-slate-900 text-slate-300 text-xs transition cursor-pointer"
            >
              <div class="font-medium text-white text-xs truncate">1-Darcha</div>
              <div class="text-[10px] text-emerald-400 truncate">Front-xodim</div>
            </button>
            <button
              type="button"
              onclick="fillCredentials('head_office', 'head123')"
              class="text-left p-2 rounded-xl border border-slate-800/80 hover:border-purple-500/40 bg-slate-950/60 hover:bg-slate-900 text-slate-300 text-xs transition cursor-pointer"
            >
              <div class="font-medium text-white text-xs truncate">Ofis boshlig'i</div>
              <div class="text-[10px] text-purple-400 truncate">SLA & Nizo</div>
            </button>
            <button
              type="button"
              onclick="fillCredentials('admin', 'admin123')"
              class="text-left p-2 rounded-xl border border-slate-800/80 hover:border-amber-500/40 bg-slate-950/60 hover:bg-slate-900 text-slate-300 text-xs transition cursor-pointer"
            >
              <div class="font-medium text-white text-xs truncate">Administrator</div>
              <div class="text-[10px] text-amber-400 truncate">Tizim boshqaruvi</div>
            </button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-900/40 py-3.5 px-4 text-center text-xs text-slate-400">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>Registrator ofisi axborot tizimi &copy; 2026</span>
      <span>O'zMU Jizzax filiali • Nizom 73-sonli buyrug'i asosida</span>
    </div>
  </footer>

  <script>
    function fillCredentials(login, pass) {
      document.getElementById('login-username').value = login;
      document.getElementById('login-password').value = pass;
    }

    async function handleUnifiedLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('login-alert');
      const btn = document.getElementById('submit-btn');

      alertBox.className = 'hidden mb-5 p-3.5 rounded-xl text-xs font-medium border';
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Tekshirilmoqda...</span>
      `;

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();

        if (resp.ok) {
          localStorage.setItem('roffice_token', data.access_token);
          localStorage.setItem('roffice_role', data.role);
          localStorage.setItem('roffice_fullname', data.full_name);
          localStorage.setItem('roffice_user_id', data.user_id);
          localStorage.setItem('roffice_must_change_password', data.must_change_password ? 'true' : 'false');

          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-medium border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 block';
          alertBox.innerText = "Muvaffaqiyatli kirildi! Shaxsiy kabinetga yo'naltirilmoqda...";

          setTimeout(() => {
            if (data.role === 'student') {
              window.location.href = '/student';
            } else {
              window.location.href = '/staff';
            }
          }, 350);
        } else {
          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
          alertBox.innerText = data.detail || "Foydalanuvchi nomi yoki parol noto'g'ri.";
        }
      } catch (err) {
        alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400 block';
        alertBox.innerText = "Server bilan aloqa o'rnatib bo'lmadi. Tarmoqni tekshiring.";
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          <span>Tizimga kirish</span>
        `;
      }
    }
  </script>
</body>
</html>
