services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roffice_appeal_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/roffice.db
      - HEMIS_BASE_URL=https://student.jbnuu.uz/rest/v1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
